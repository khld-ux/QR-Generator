<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #10b981;
            --bg-light: #f9fafb;
            --bg-card: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --transition: all 0.2s ease;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, #f5f7ff 0%, #eef2ff 100%);
            min-height: 100vh;
            padding: 2rem;
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 2rem;
        }

        .section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: var(--transition);
            background: var(--bg-light);
        }

        .input-group input:focus,
        .input-group select:focus,
        .input-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .controls {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            margin-bottom: 2rem;
        }

        .control-item {
            display: flex;
            flex-direction: column;
        }

        .preview {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }

        #qrCanvas {
            border: 2px solid var(--border);
            border-radius: var(--radius);
            background: white;
            box-shadow: var(--shadow);
            max-width: 100%;
            height: auto;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 1rem;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .design-section {
            border-top: 1px dashed var(--border);
            padding-top: 2rem;
        }

        .logo-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            margin-top: 1rem;
        }

        .logo-control {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 180px;
        }

        .logo-size-label {
            font-size: 0.9rem;
            font-weight: 500;
            margin-left: 0.5rem;
            color: var(--text-muted);
        }

        .helper-text {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .quality-slider {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .quality-value {
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            header h1 {
                font-size: 1.75rem;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .logo-controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>QR Code Generator</h1>
            <p>Create, customize, and download beautiful QR codes</p>
        </header>

        <div class="content">
            <div class="section">
                <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M4.5 1a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0-.5-.5zm2 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0-.5-.5zm3.5-.25a.5.5 0 0 1 .5.5v1a.5.5 0 0 0 .5.5h1a1.5 1.5 0 1 1 0 3h-1a.5.5 0 0 0 .5.5v1a.5.5 0 0 1-1 0v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 1-.5-.5h-1a1.5 1.5 0 1 1 0-3zm-6.5 6.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0-.5-.5zm4 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0-.5-.5z"/></svg> Enter Content</h2>
                <div class="input-group">
                    <textarea id="textInput" placeholder="Enter text, URL, or any data to encode..."></textarea>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2zm0 1a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V1zm13 3H1v9h14V4z"/></svg> Appearance</h2>
                <div class="controls">
                    <div class="control-item">
                        <label for="fgColor">Foreground Color</label>
                        <input type="color" id="fgColor" value="#000000">
                    </div>

                    <div class="control-item">
                        <label for="bgColor">Background Color</label>
                        <input type="color" id="bgColor" value="#ffffff">
                    </div>

                    <div class="control-item">
                        <label for="size">Size (px)</label>
                        <input type="number" id="size" value="250" min="100" max="500">
                    </div>

                    <div class="control-item">
                        <label for="eccLevel">Error Correction</label>
                        <select id="eccLevel">
                            <option value="L">L (7%)</option>
                            <option value="M" selected>M (15%)</option>
                            <option value="Q">Q (25%)</option>
                            <option value="H">H (30%)</option>
                        </select>
                    </div>

                    <div class="control-item">
                        <label for="format">Download Format</label>
                        <select id="format">
                            <option value="png">PNG</option>
                            <option value="jpeg">JPEG</option>
                            <option value="svg">SVG</option>
                        </select>
                    </div>

                    <div class="control-item" id="jpegQualityContainer">
                        <label>JPEG Quality</label>
                        <div class="quality-slider">
                            <input type="range" id="jpegQuality" min="0" max="100" value="90">
                            <span class="quality-value" id="jpegQualityValue">90</span>%
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="m8 9.355-1.149-.866a1 1 0 0 0-1.032 0l-.206 1.754c-.048.337.148.573.388.573h1.004c.24 0 .436-.236.388-.573l-.206-1.754a1 1 0 0 0-1.032 0l-1.149.866zm2.852-.708a1 1 0 0 0-1.414 0l-.708-.707a1 1 0 0 0-1.414 0l-.707.708a1 1 0 0 0 0 1.414l.707.708a1 1 0 0 0 1.414 0l.708-.707a1 1 0 0 0 0-1.414z"/></svg> Preview</h2>
                <div class="preview">
                    <canvas id="qrCanvas" width="250" height="250"></canvas>
                </div>

                <button class="btn" id="downloadBtn">Download QR Code</button>
            </div>

            <div class="design-section">
                <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h1a1 1 0 0 1 0 2h1a1 1 0 0 1 0-2h1a1 1 0 0 0 1-1v-1a1 1 0 0 0-1-1h-2zm2 0a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h1a1 1 0 0 1 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0-1-1v-1a1 1 0 0 0-1-1h-1z"/><path d="M7.002 13a1 1 0 1 0 2 0 1 1 0 0 0-2 0zm5-12a1 1 0 0 1 1 1v6a1 1 0 0 1-2 0V2a1 1 0 0 1 1-1zm-4 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg> Design QR Code</h2>
                <div class="logo-controls">
                    <div class="logo-control">
                        <label for="logoUpload">Add Logo/Image (optional)</label>
                        <input type="file" id="logoUpload" accept="image/*">
                    </div>

                    <div class="logo-control">
                        <label for="logoSize">Logo Size:</label>
                        <div style="display: flex; align-items: center;">
                            <input type="range" id="logoSize" min="10" max="50" value="20">
                            <span class="logo-size-label" id="logoSizeValue">20</span>% of QR
                        </div>
                    </div>
                </div>

                <p class="helper-text">Logo works for PNG and JPEG formats. For SVG, logo will be ignored.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script>
        // DOM Elements
        const textInput = document.getElementById('textInput');
        const fgColor = document.getElementById('fgColor');
        const bgColor = document.getElementById('bgColor');
        const sizeInput = document.getElementById('size');
        const eccLevel = document.getElementById('eccLevel');
        const formatSelect = document.getElementById('format');
        const jpegQualityInput = document.getElementById('jpegQuality');
        const jpegQualityValue = document.getElementById('jpegQualityValue');
        const downloadBtn = document.getElementById('downloadBtn');
        const qrCanvas = document.getElementById('qrCanvas');
        const jpegQualityContainer = document.getElementById('jpegQualityContainer');
        const logoUpload = document.getElementById('logoUpload');
        const logoSizeInput = document.getElementById('logoSize');
        const logoSizeValue = document.getElementById('logoSizeValue');

        // State
        let logoImg = null;

        // UI Updates
        jpegQualityInput.addEventListener('input', () => {
            jpegQualityValue.textContent = jpegQualityInput.value;
        });

        logoSizeInput.addEventListener('input', () => {
            logoSizeValue.textContent = logoSizeInput.value;
            generateQRCode(); // Regenerate when logo size changes
        });

        // Format-based UI
        function updateFormatUI() {
            if (formatSelect.value === 'jpeg') {
                jpegQualityContainer.style.display = 'block';
            } else {
                jpegQualityContainer.style.display = 'none';
            }
            // Regenerate when format changes (logo may be disallowed for SVG)
            generateQRCode();
        }

        formatSelect.addEventListener('change', updateFormatUI);
        // Initial state
        if (formatSelect.value !== 'jpeg') {
            jpegQualityContainer.style.display = 'none';
        }

        // Logo handling
        logoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) {
                logoImg = null;
                generateQRCode();
                return;
            }
            const reader = new FileReader();
            reader.onload = (event) => {
                logoImg = new Image();
                logoImg.crossOrigin = 'anonymous';
                logoImg.onload = () => {
                    generateQRCode();
                };
                logoImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Main generation function
        function generateQRCode() {
            const text = textInput.value.trim();
            if (!text) {
                // Clear canvas if empty
                const ctx = qrCanvas.getContext('2d');
                ctx.clearRect(0, 0, qrCanvas.width, qrCanvas.height);
                return;
            }

            const width = parseInt(sizeInput.value);
            const height = parseInt(sizeInput.value);

            // Update canvas dimensions to match size
            qrCanvas.width = width;
            qrCanvas.height = height;

            // Draw QR code
            QRCode.toCanvas(qrCanvas, text, {
                width: width,
                height: height,
                color: {
                    dark: fgColor.value,
                    light: bgColor.value
                },
                errorCorrectionLevel: eccLevel.value,
                margin: 2
            }, (error) => {
                if (error) {
                    console.error(error);
                    alert('Failed to generate QR code');
                } else {
                    // Draw logo if present and format is not SVG
                    if (logoImg && formatSelect.value !== 'svg') {
                        drawLogo();
                    }
                }
            });
        }

        function drawLogo() {
            const canvas = qrCanvas;
            const ctx = canvas.getContext('2d');
            const size = parseInt(sizeInput.value);
            const logoSizePercent = parseInt(logoSizeInput.value);
            const logoSizePx = (size * logoSizePercent) / 100;
            const x = (size - logoSizePx) / 2;
            const y = (size - logoSizePx) / 2;

            ctx.save();
            ctx.drawImage(logoImg, x, y, logoSizePx, logoSizePx);
            ctx.restore();
        }

        // Event listeners for auto-update
        textInput.addEventListener('input', generateQRCode);
        fgColor.addEventListener('input', generateQRCode);
        bgColor.addEventListener('input', generateQRCode);
        sizeInput.addEventListener('input', generateQRCode); // Changed from change to input
        eccLevel.addEventListener('change', generateQRCode);
        // logo_size already handled

        // Initial generation
        generateQRCode();

        // Download functionality
        downloadBtn.addEventListener('click', () => {
            const format = formatSelect.value;
            const filename = `qrcode.${format}`;

            if (format === 'svg') {
                // Generate SVG via QRCode library (logo ignored for SVG)
                QRCode.toString(textInput.value.trim(), {
                    type: 'svg',
                    color: {
                        dark: fgColor.value,
                        light: bgColor.value
                    },
                    errorCorrectionLevel: eccLevel.value,
                    margin: 2
                }, (err, svg) => {
                    if (err) {
                        console.error(err);
                        alert('Failed to generate SVG');
                        return;
                    }
                    downloadSVG(svg, filename);
                });
            } else if (format === 'jpeg') {
                const quality = jpegQualityInput.value / 100;
                qrCanvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                }, 'image/jpeg', quality);
            } else { // png
                qrCanvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    a.click();
                    URL.revokeObjectURL(url);
                }, 'image/png');
            }
        });

        function downloadSVG(svg, filename) {
            const blob = new Blob([svg], {type: 'image/svg+xml;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
