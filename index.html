<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>QR Code Generator</h1>
            <p>Create, customize, and download beautiful QR codes</p>
        </header>

        <div class="content">
            <div class="section">
                <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M4.5 1a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0-.5-.5zm2 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0-.5-.5zm3.5-.25a.5.5 0 0 1 .5.5v1a.5.5 0 0 0 .5.5h1a1.5 1.5 0 1 1 0 3h-1a.5.5 0 0 0 .5.5v1a.5.5 0 0 1-1 0v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 1-.5-.5h-1a1.5 1.5 0 1 1 0-3zm-6.5 6.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0-.5-.5zm4 0a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 1 0 1h-1a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0-.5-.5z"/></svg> Enter Content</h2>
                <div class="input-group">
                    <textarea id="textInput" placeholder="Enter text, URL, or any data to encode..."></textarea>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2zm0 1a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V1zm13 3H1v9h14V4z"/></svg> Appearance</h2>
                <div class="controls">
                    <div class="control-item">
                        <label for="fgColor">Foreground Color</label>
                        <input type="color" id="fgColor" value="#000000">
                    </div>

                    <div class="control-item">
                        <label for="bgColor">Background Color</label>
                        <input type="color" id="bgColor" value="#ffffff">
                    </div>

                    <div class="control-item">
                        <label for="size">Size (px)</label>
                        <input type="number" id="size" value="250" min="100" max="500">
                    </div>

                    <div class="control-item">
                        <label for="eccLevel">Error Correction</label>
                        <select id="eccLevel">
                            <option value="L">L (7%)</option>
                            <option value="M" selected>M (15%)</option>
                            <option value="Q">Q (25%)</option>
                            <option value="H">H (30%)</option>
                        </select>
                    </div>

                    <div class="control-item">
                        <label for="format">Download Format</label>
                        <select id="format">
                            <option value="png">PNG</option>
                            <option value="jpeg">JPEG</option>
                            <option value="svg">SVG</option>
                        </select>
                    </div>

                    <div class="control-item" id="jpegQualityContainer">
                        <label>JPEG Quality</label>
                        <div class="quality-slider">
                            <input type="range" id="jpegQuality" min="0" max="100" value="90">
                            <span class="quality-value" id="jpegQualityValue">90</span>%
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path d="m8 9.355-1.149-.866a1 1 0 0 0-1.032 0l-.206 1.754c-.048.337.148.573.388.573h1.004c.24 0 .436-.236.388-.573l-.206-1.754a1 1 0 0 0-1.032 0l-1.149.866zm2.852-.708a1 1 0 0 0-1.414 0l-.708-.707a1 1 0 0 0-1.414 0l-.707.708a1 1 0 0 0 0 1.414l.707.708a1 1 0 0 0 1.414 0l.708-.707a1 1 0 0 0 0-1.414z"/></svg> Preview</h2>
                <div class="preview">
                    <canvas id="qrCanvas" width="250" height="250"></canvas>
                </div>

                <button class="btn" id="downloadBtn">Download QR Code</button>
            </div>

            <div class="design-section">
                <h2 class="section-title"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h1a1 1 0 0 1 0 2h1a1 1 0 0 1 0-2h1a1 1 0 0 0 1-1v-1a1 1 0 0 0-1-1h-2zm2 0a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1h1a1 1 0 0 1 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0-1-1v-1a1 1 0 0 0-1-1h-1z"/><path d="M7.002 13a1 1 0 1 0 2 0 1 1 0 0 0-2 0zm5-12a1 1 0 0 1 1 1v6a1 1 0 0 1-2 0V2a1 1 0 0 1 1-1zm-4 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg> Design QR Code</h2>
                <div class="logo-controls">
                    <div class="logo-control">
                        <label for="logoUpload">Add Logo/Image (optional)</label>
                        <input type="file" id="logoUpload" accept="image/*">
                    </div>

                    <div class="logo-control">
                        <label for="logoSize">Logo Size:</label>
                        <div style="display: flex; align-items: center;">
                            <input type="range" id="logoSize" min="10" max="50" value="20">
                            <span class="logo-size-label" id="logoSizeValue">20</span>% of QR
                        </div>
                    </div>
                </div>

                <p class="helper-text">Logo works for PNG and JPEG formats. For SVG, logo will be ignored.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
